name: Browser Rust relay

on:
  push:
    paths:
      - 'wasm/proxy/**'
      - 'wasm/electron/**'
      - '.node-version'
      - '.npm-version'
      - 'wasm/relay-rust/**'
      - 'wasm/www/appearance.js'
      - 'wasm/www/interface*'
      - 'wasm/www/style.css'
      - 'wasm/www/runtime-checks.js'
      - 'wasm/www/console-setup.js'
      - 'wasm/www/username-lookup.js'
      - 'wasm/www/pc-controls.js'
      - 'wasm/www/video-renderer.js'
      - 'wasm/www/first-run.html'
      - 'wasm/desktop-browser/**'
      - 'scripts/*browser*'
      - 'scripts/launch-mac.mjs'
      - 'scripts/run-web.sh'
      - 'scripts/build-wasm.sh'
      - 'mac-setup.sh'
      - 'Start Chiaki-NG Web.command'
      - 'wasm/www/app.js'
      - 'wasm/www/index.html'
      - 'wasm/www/i18n/**'
      - '.github/workflows/browser-relay.yml'
  pull_request:
    paths:
      - 'wasm/proxy/**'
      - 'wasm/electron/**'
      - '.node-version'
      - '.npm-version'
      - 'wasm/relay-rust/**'
      - 'wasm/www/appearance.js'
      - 'wasm/www/interface*'
      - 'wasm/www/style.css'
      - 'wasm/www/runtime-checks.js'
      - 'wasm/www/console-setup.js'
      - 'wasm/www/username-lookup.js'
      - 'wasm/www/pc-controls.js'
      - 'wasm/www/video-renderer.js'
      - 'wasm/www/first-run.html'
      - 'wasm/desktop-browser/**'
      - 'scripts/*browser*'
      - 'scripts/launch-mac.mjs'
      - 'scripts/run-web.sh'
      - 'scripts/build-wasm.sh'
      - 'mac-setup.sh'
      - 'Start Chiaki-NG Web.command'
      - 'wasm/www/app.js'
      - 'wasm/www/index.html'
      - 'wasm/www/i18n/**'
      - '.github/workflows/browser-relay.yml'

permissions:
  contents: read

jobs:
  relay:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - run: npm ci --prefix wasm/electron --ignore-scripts
      - run: npm audit --prefix wasm/electron --audit-level=low
      - name: Check macOS shell syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n mac-setup.sh scripts/build-wasm.sh "Start Chiaki-NG Web.command"
          sh -n scripts/run-web.sh
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path wasm/relay-rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path wasm/relay-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path wasm/relay-rust/Cargo.toml
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file wasm/relay-rust/Cargo.lock
      - run: cargo build --release --locked --manifest-path wasm/relay-rust/Cargo.toml
      - run: node --test wasm/proxy/*.test.mjs
